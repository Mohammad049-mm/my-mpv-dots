# ====================================================================
# MPV INPUT CONFIG (Optimiert & Korrigiert)
# ====================================================================

# --- Navigation & YouTube-Style (Zahlenreihe) ---
1 seek 10 absolute-percent ; set pause no
2 seek 20 absolute-percent ; set pause no
3 seek 30 absolute-percent ; set pause no
4 seek 40 absolute-percent ; set pause no
5 seek 50 absolute-percent ; set pause no
6 seek 60 absolute-percent ; set pause no
7 seek 70 absolute-percent ; set pause no
8 seek 80 absolute-percent ; set pause no
9 seek 90 absolute-percent ; set pause no
0 seek 0 absolute ; set pause no

# --- Nummernblock (Gleiches Verhalten) ---
KP1 seek 10 absolute-percent ; set pause no
KP2 seek 20 absolute-percent ; set pause no
KP3 seek 30 absolute-percent ; set pause no
KP4 seek 40 absolute-percent ; set pause no
KP5 seek 50 absolute-percent ; set pause no
KP6 seek 60 absolute-percent ; set pause no
KP7 seek 70 absolute-percent ; set pause no
KP8 seek 80 absolute-percent ; set pause no
KP9 seek 90 absolute-percent ; set pause no
KP0 seek 0 absolute ; set pause no

# --- Wiedergabe & Playback ---
HOME      cycle pause
PGDWN     playlist-next
PGUP      playlist-prev
END       seek 0 absolute ; set pause yes
SPACE     cycle pause
ENTER     ignore

# --- Medientasten (Optimiert für Wayland/Fedora) ---
PLAY      cycle pause
PAUSE     cycle pause
PLAYPAUSE cycle pause
NEXT      playlist-next
PREV      playlist-prev
STOP      seek 0 absolute ; set pause yes

# --- Suche / Seeking (Pfeiltasten) ---
RIGHT       no-osd seek  2
LEFT        no-osd seek -2
Shift+RIGHT no-osd seek  1 exact
Shift+LEFT  no-osd seek -1 exact

# --- Lautstärke ---
UP          add volume  2
DOWN        add volume -2
WHEEL_UP    add volume  2
WHEEL_DOWN  add volume -2

# --- Video-Einstellungen & Bild ---
b cycle-values video-aspect-override "16:9" "9:16" "4:3" "2.35:1" "-1"
R cycle-values video-rotate "90" "180" "270" "0"
B cycle-values brightness "0" "4"
w cycle-values loop-file "inf" "no"

# --- Kapitel & Tracks ---
n            playlist-next
v            playlist-prev
N            add chapter 1
Alt+n        add chapter -1
s            cycle sub
a            cycle audio

# --- Maussteuerung ---
MBTN_MID     cycle pause
MBTN_BACK    add chapter -1
MBTN_FORWARD add chapter 1

# --- Information & Tools ---
p           show-text ${playlist}
c           show-text ${chapters}
ctrl+s      async screenshot
k           script-binding console/enable
h           script-binding memo-history
esc         quit

# --- Datei-Handling (Korrigiert für Linux) ---
# Öffnet den Ordner, in dem die aktuelle Datei liegt
o run "sh" "-c" "xdg-open \"$(dirname \"$best_path\")\""
