# --- Screenshots ---
# Erstellt den Ordner automatisch, falls er existiert (Pfad korrigiert)
screenshot-template="~/Pictures/SnapShots/mpv-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-format=png
screenshot-png-compression=0
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes

# --- Audio ---
volume-max=120
volume=40
alang=de,ger,en,eng,ar,ara

## --- Fenster & Video-Verhalten ---
# Startet mpv immer in 720p, aber skaliert korrekt
autofit=1280x720
# Verhindert, dass sich der Player nach dem Videoende schließt
keep-open=yes

# --- Integration ---
# Damit mpv wie VLC auf die Medientasten deines LOQ reagiert (erfordert mpv-mpris)
script-opts=mpris-enable=yes

